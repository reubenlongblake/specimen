# Specimen for TrueNAS SCALE
# Apps > Discover Apps > Custom App > Install via YAML, then paste this file.
#
# Before installing:
#   - Create the dataset APPS/SPECIMEN (Apps preset) for Specimen's own data.
#   - Give the "apps" user (568) access to DECADE_STUDIOS: Modify on 02_FONTS for uploads/deletes.

services:
  specimen:
    image: ghcr.io/GITHUB_USER/specimen:latest
    container_name: specimen
    restart: unless-stopped
    user: "568:568"
    environment:
      FONTS_SUBDIR: 02_SHARED_ASSETS/02_FONTS   # first-run default; change any time in Settings
      TZ: Europe/London
    ports:
      - "8095:8095"
    volumes:
      - /mnt/APPS/SPECIMEN:/data                # tags, settings, index, preview cache
      - /mnt/MISCHA/DECADE_STUDIOS:/library     # Settings can pick any folder inside this
